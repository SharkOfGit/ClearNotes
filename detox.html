<!DOCTYPE HTML>
<head>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
<link rel="icon" href="Notes360-MiniLogo.png">
<style>
html {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background-image: url("https://i.pinimg.com/originals/4b/dd/08/4bdd083ae4c96a16b63c8bf5e1f2492a.gif");
    background-size: 100% 100%;
}

.background-image {
  filter: brightness(60%);
}

h2, h3, p, ul, ol, button {
  font-family: "Segoe UI", "Segoe UI Light", sans-serif;
  margin: 10px;
  color: white;
}

h1 {
  color: white;
  margin: 10px;
  font-family: "Gravitas One", "Noto Serif", serif;
}

.stickynote {
  width: 600px;
  height: auto;
  background-color: #87f8fa;
  display: grid;
  padding: 10px;
  color: black;
  border-radius: 15px;
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
  margin: 10px;
}

.stickynotes-grid {
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 10px;
  background-color: grey;
  border-radius: 10px;
  padding: 10px;
  margin: 10px;
}

.custom-button {
  background-color: cyan;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin: 10px;
}

.custom-button:hover {
  background-color: orange;
}

.video-container {
  width: 640px;
  height: 360px;
  border-radius: 15px; /* This adds the rounded corners */
  overflow: clip;      /* This hides the sharp corners of the video inside the container */
  margin: 10px;
}

.topshape {
  width: 100%;
  height: auto;
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  margin-left: 0px;
  box-shadow: 0px 3px 8px rgba(0,0,0,0.2);
}

.fixed-container {
   width: 200px;
   height: 200px;
  margin: 10px;
}
.fixed-container img {
   width: 100%;
   height: 100%;
   object-fit: cover;
}

.video {
  width: 100%;
  height: 100%;
  border-radius: 10px;
}

img {
  border-radius: 10px;
}

.grid-container {
  display: flex;
  overflow: auto;
  white-space: nowrap;
  gap: 10px;
}

.grid-item {
  background-color: lightblue;
  padding: 10px;
  border-radius: 10px;
  width: auto;
  height: auto;
  text-align: center;
}

.grid-item h2, h3, p {
  color: black;
}

.centered-text {
  text-align: center;
}
</style>

<title>Notes360 - Detox</title>
</head>

<body>
<h1><u>Detox</u></h1>

<p style="color: white;">Wind down from your distractions. Purely focus on studying.</p>

<hr>

<h2>Pick your distraction</h2>

<div class="grid-container">

<div class="grid-item">
<h3>Short-Form Content</h3>
<p>Content like YT Shorts, IG Reels, Tiktok, etc.</p>
<img src="https://i.giphy.com/FASybzL1ElrxpT2rTq.webp" alt="img">
</div>

<div class="grid-item">
<h3>Food</h3>
<p>Overeating food items (snacks) for leisure.</p>
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRbZ_IhNHNlRiq_0j_hs7xtBOF4345jQY8k7w&s" alt="img">
</div>

<div class="grid-item">
<h3>Sleeping</h3>
<p>Taking naps when bored.</p>
<img src="https://cdn-icons-png.flaticon.com/256/3094/3094837.png" alt="img">
</div>

<div class="grid-item">
<h3>Gaming</h3>
<p>Playing video games too much.</p>
<img src="https://png.pngtree.com/png-vector/20240930/ourmid/pngtree-retro-neon-video-game-controller-png-image_13929194.png" alt="img">
</div>

</div>

</body>
</html>
