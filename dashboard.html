<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ClearNotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dashboard-body">

  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo">ClearNotes</span>
    </div>
    <nav>
      <a href="index.html">🏠 Home</a>
      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="pickSubject.html">📚 My Subjects</a>
      <a href="study.html">✍️ Study Desk</a>
      <a href="uploadnotes.html">📤 Upload</a>
    </nav>
    <div class="sidebar-footer">
      <a href="signup.html" class="logout-btn">🚪 Logout</a>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-header">
      <div class="welcome-text">
        <h1 id="greeting">Welcome back!</h1>
        <p>You are viewing <strong>Grade <span id="grade-display"></span></strong> at <em id="school-name"></em></p>
      </div>
      <div class="live-clock" id="clock">00:00:00</div>
    </header>

    <div class="stats-row">
       <div class="stat-card">
          <small>Active Subject</small>
          <p>Science</p>
       </div>
       <div class="stat-card">
          <small>Resources</small>
          <p>NCERT Class 9</p>
       </div>
    </div>

    <section class="section">
      <h2 class="section-title">Quick Actions</h2>
      <div class="card-grid">
        <article class="card subject-card">
          <h3>Science Textbook</h3>
          <div class="book-preview">
            <img src="https://ncert.nic.in/textbook/pdf/iesc1cc.jpg" alt="Cover">
          </div>
          <button id="search-info" class="btn btn-primary w-100">Get PDF</button>
        </article>

        <article class="card study-card">
           <h3>Launch Study Buddy</h3>
           <p>Open your AI-powered companion.</p>
           <a href="study.html" class="btn btn-secondary w-100">Open Desk</a>
        </article>
      </div>
    </section>
  </main>

  <script>
    // --- DATA LOADING ---
    const schoolData = localStorage.getItem("chosenSchool");
    const school = schoolData ? JSON.parse(schoolData) : { name: "Your School" };
    const grade = localStorage.getItem("chosenGrade") || "9";

    document.getElementById("school-name").textContent = school.name;
    document.getElementById("grade-display").textContent = grade;

    // --- LIVE CLOCK ---
    function updateClock() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString();
      
      const hours = now.getHours();
      let greet = "Good Morning";
      if(hours >= 12) greet = "Good Afternoon";
      if(hours >= 17) greet = "Good Evening";
      document.getElementById("greeting").textContent = `${greet}, Student!`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- SEARCH LOGIC ---
    document.getElementById("search-info").onclick = () => {
      const query = `NCERT Science Textbook Class ${grade} PDF`;
      window.open("https://www.google.com/search?q=" + encodeURIComponent(query), "_blank");
    };
  </script>
</body>
</html>
