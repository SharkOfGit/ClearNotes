<!DOCTYPE HTML>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
<link rel="icon" href="Notes360-MiniLogo.png">
<link rel="stylesheet" href="styles.css">

<title>Notes360 - Choose Grade</title>
</head>

<body>

<h1>Step 1 complete.</h1>
<hr>

<h2>You've chosen <b><u><span id="chosen-school"></span></u></b> 
<img src="https://cdn-icons-png.flaticon.com/32/167/167707.png" alt="img"> .</h2>
<p id="school-address"></p>

<hr>

<a id="google-search-link" href="#" target="_blank">
  <button class="custom-button">Search this school on Google <br><br> 
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/100px-Google_2015_logo.svg.png" alt="logo"></button>
</a>

<script>
  // Load chosen school from localStorage
  const school = JSON.parse(localStorage.getItem("chosenSchool"));

  if (school) {
    document.getElementById("chosen-school").textContent = school.name;
    document.getElementById("school-address").textContent = school.address;

    // Set Google search link dynamically
    const searchLink = "https://www.google.com/search?q=" + encodeURIComponent(school.name);
    document.getElementById("google-search-link").href = searchLink;
  } else {
    document.getElementById("chosen-school").textContent = "No school selected!";
    document.getElementById("school-address").textContent = "";
    document.getElementById("google-search-link").style.display = "none";
  }
</script>

<br>
<hr style="border: none; height: 5px; background-color: #333;">

<h1>Step 2: Choose your grade.</h1>

<label for="grade-picker"><b>Pick grades from 1→12:</b></label>
<select id="grade-picker">
  <option value="" selected disabled>Select Grade</option>
  <option value="1">1st Grade</option>
  <option value="2">2nd Grade</option>
  <option value="3">3rd Grade</option>
  <option value="4">4th Grade</option>
  <option value="5">5th Grade</option>
  <option value="6">6th Grade</option>
  <option value="7">7th Grade</option>
  <option value="8">8th Grade</option>
  <option value="9">9th Grade</option>
  <option value="10">10th Grade</option>
  <option value="11">11th Grade</option>
  <option value="12">12th Grade</option>
</select>
<br><br>

<button id="save-grade">Save Grade</button>

<script>
const gradePicker = document.getElementById("grade-picker");
const saveButton = document.getElementById("save-grade");

saveButton.addEventListener("click", () => {
    const grade = gradePicker.value;
    if (!grade) {
        alert("Please select a grade first!");
        return;
    }
    localStorage.setItem("chosenGrade", grade);
    window.location.href = "choosesection.html";
});
</script>

</body>
</html>
