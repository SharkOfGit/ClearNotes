<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Notes — ClearNotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="ClearNotesMiniLogo.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dashboard-body">

  <aside class="sidebar">
    <span class="logo">ClearNotes</span>
    <nav>
      <a href="index.html">🏠 Home</a>
      <a href="personalizedDashboard.html">📊 Dashboard</a>
      <a href="pickSubject.html">📚 My Subjects</a>
      <a href="study.html">✍️ Study Desk</a>
      <a href="uploadnotes.html" class="active">📤 Upload</a>
    </nav>
  </aside>

  <main class="dashboard-main">
    <header class="page-header">
      <div>
        <h1>Your contribution matters</h1>
        <p class="section-desc">Share resources with your classmates at <span id="school-info-display" style="font-weight: 600;"></span>.</p>
      </div>
    </header>

    <div class="container-narrow">
      <div class="card">
        <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 20px;">
          <em>Note: This is a testing page for uploads.</em>
        </p>

        <form action="/uploadnotes.html" method="POST" enctype="multipart/form-data">
          
          <div class="form-group">
            <label>Your Name (shown to classmates)</label>
            <input type="text" name="uploader" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label>Subject</label>
            <select name="subject" required>
              <option value="" disabled selected>Select subject</option>
              <option>Science</option>
              <option>Maths</option>
              <option>Malayalam</option>
              <option>English</option>
              <option>Social Science</option>
            </select>
          </div>

          <div class="form-group">
            <label>Select PDF</label>
            <div class="file-upload-box">
              <input type="file" name="note" accept="application/pdf" required>
              <p>Click to select PDF file</p>
            </div>
          </div>

          <input type="hidden" name="school" id="school-field">
          <input type="hidden" name="grade" id="grade-field">
          <input type="hidden" name="section" id="section-field">

          <button type="submit" class="btn btn-primary w-100">Upload Note</button>
        </form>
      </div>
      
      <div class="info-box">
        <h4>Submission Tip</h4>
        <p>Ensure your PDF is clear and legible for the best learning experience.</p>
      </div>
    </div>
  </main>

  <script>
    const school = JSON.parse(localStorage.getItem("chosenSchool"));
    const grade = localStorage.getItem("chosenGrade");
    const section = localStorage.getItem("chosenSection");

    if (!school || !grade || !section) {
      alert("Information missing. Please sign up.");
      window.location.href = "signup.html";
    }

    document.getElementById("school-info-display").textContent = school.name;
    document.getElementById("school-field").value = school.name;
    document.getElementById("grade-field").value = grade;
    document.getElementById("section-field").value = section;
  </script>
</body>
</html>
