<!DOCTYPE HTML>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
<link rel="icon" href="Notes360-MiniLogo.png">
<style>
h2, h3, p, ul, ol, button {
  font-family: "Segoe UI", "Segoe UI Light", sans-serif;
}
h1 {
  font-family: "Gravitas One", "Noto Serif", serif;
}
.custom-button {
  background-color: cyan;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}
.custom-button:hover {
  background-color: orange;
}
body {
  background-image: linear-gradient(to bottom, #fcead4, #fad4a5);
  margin: 10px;
}
.stickynote {
  width: 600px;
  height: auto;
  background-color: #87f8fa;
  display: grid;
  padding: 10px;
  color: black;
  border-radius: 15px;
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
}
.stickynotes-grid {
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 10px;
  background-color: grey;
  border-radius: 10px;
  padding: 10px;
}
.video-container {
  width: 640px;
  height: 360px;
  border-radius: 15px;
  overflow: clip;
}
.fixed-container {
   width: 200px;
   height: 200px;
}
.fixed-container img {
   width: 100%;
   height: 100%;
   object-fit: cover;
}
.video {
  width: 100%;
  height: 100%;
  display: inline;
}
img {
  border-radius: 10px;
}
</style>
<title>Notes360 - Upload Notes</title>
</head>
<body>
<h1>Your contribution matters.</h1>

<h2><i>This is not a server version of Notes360, but just a testing page for uploads.</i></h2>
<hr>

<h2>Upload a Note</h2>

<form action="/uploadnotes.html" method="POST" enctype="multipart/form-data">

  <label><b>Your Name (shown to classmates):</b></label><br>
  <input type="text" name="uploader" required><br><br>

  <label><b>Subject:</b></label><br>
  <select name="subject" required>
    <option value="" disabled selected>Select subject</option>
    <option>Science</option>
    <option>Maths</option>
    <option>Malayalam</option>
    <option>English</option>
    <option>Social Science</option>
  </select><br><br>

  <label><b>Select PDF:</b></label><br>
  <input type="file" name="note" accept="application/pdf" required><br><br>

  <!-- Hidden fields auto-filled from signup -->
  <input type="hidden" name="school" id="school-field">
  <input type="hidden" name="grade" id="grade-field">
  <input type="hidden" name="section" id="section-field">

  <input type="submit" value="Upload Note" class="custom-button">
</form>

<script>
  const school = JSON.parse(localStorage.getItem("chosenSchool"));
  const grade = localStorage.getItem("chosenGrade");
  const section = localStorage.getItem("chosenSection");

  if (!school || !grade || !section) {
    alert("Signup information missing. Please sign up again.");
    window.location.href = "signup.html"; // or first signup page
  }

  document.getElementById("school-field").value = school.name;
  document.getElementById("grade-field").value = grade;
  document.getElementById("section-field").value = section;
</script>

</body>
</html>
