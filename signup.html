<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes - Signup</title>

  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="icon" href="ClearNotesMiniLogo.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="upload-container">
      <h1>ClearNotes</h1>
      <p class="subtitle"><b>Let's start by choosing your profile setup!</b></p>
      
      <div class="form-group">
        <label for="grade-select">Select Grade / Class:</label>
        <select id="grade-select">
          <option value="Class 9">Class 9</option>
          <option value="Class 10">Class 10</option>
          <option value="Class 11">Class 11</option>
          <option value="Class 12">Class 12</option>
        </select>
      </div>

      <div class="form-group">
        <label for="section-select">Select Section:</label>
        <select id="section-select">
          <option value="A">Div A</option>
          <option value="B">Div B</option>
          <option value="C">Div C</option>
        </select>
      </div>

      <hr>

      <button onclick="saveAndProceed()" class="btn btn-primary w-100">Choose your school</button>

      <p class="text-center mt-3" style="color: var(--text-muted); font-size: 0.85rem;">
        By signing up, you get personalized notes and resources from your specific grade and section.
      </p>
    </div>
  </div>

  <script>
    function saveAndProceed() {
      const selectedGrade = document.getElementById('grade-select').value;
      const selectedSection = document.getElementById('section-select').value;

      // Preserves structural variables downstream
      localStorage.setItem("chosenGrade", selectedGrade);
      localStorage.setItem("chosenSection", selectedSection);

      window.location.href = "maps.html";
    }
  </script>

</body>
</html>
