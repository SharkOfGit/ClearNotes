<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClearNotes - Signup</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap CSS (needed for standard btn classes if you don't define them all) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-main: #fcf2bd;
      --bg-card: #ffffff;
      --accent: #f76307;
      --accent-soft: #fffcab;
      --text-main: #1e1e1e;
      --text-muted: #666;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    * {
      box-sizing: border-box;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 40px;
      background: linear-gradient(to bottom, #ffffff, var(--bg-main));
      color: var(--text-main);
      min-height: 100vh;
    }

    .upload-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    h1, h2 { text-align: center; }
    
    .instruction {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 30px;
    }

    /* CUSTOM BUTTON STYLING */
    .btn-primary {
      background-color: var(--accent) !important;
      border: none !important;
      padding: 12px 25px;
      border-radius: 12px;
      font-weight: 600;
    }

    .btn-secondary {
      background-color: var(--accent-soft) !important;
      color: var(--accent) !important;
      border: 1px solid var(--accent) !important;
      padding: 10px 20px;
      border-radius: 12px;
      display: inline-block;
      cursor: pointer;
      font-weight: 600;
    }

    /* Hide the actual ugly file input */
    .hidden-file-input {
      display: none;
    }

    #file-name-display {
      display: block;
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--accent);
      font-style: italic;
    }

    .form-group {
      margin-bottom: 20px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>


<body>

  <div class="login-shape">
    <div style="text-align: center;">
      <h1>ClearNotes</h1>
      <p><b>Let's start by choosing your school!</b></p>
    <a href="maps.html" style="text-decoration: none;">
      <button class="btn btn-primary">Choose your school</button>
    </a>

    <hr>
    <p>By signing up, you get personalized notes and resources from your specific grade and section.</p>
    </div>
   </div>
</body>
</html>
