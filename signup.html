<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ClearNotes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <div class="container nav-flex">
    <a href="index.html" style="text-decoration:none; color:black;"><strong>ClearNotes</strong></a>
  </div>
</nav>

<main class="auth-wrapper">
  <div class="card">
    <header style="margin-bottom: 24px; text-align: center;">
      <h2>Welcome</h2>
      <p style="color: var(--text-muted);">Create your student account</p>
    </header>

    <div class="form-group">
      <input type="text" placeholder="Full Name">
      <input type="email" placeholder="Email Address">
      <input type="password" placeholder="Password">
    </div>

    <button class="btn btn-primary" style="width: 100%;">Create Account</button>
    
    <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
      Already have an account? <a href="#" style="color: var(--primary);">Sign In</a>
    </p>
  </div>
</main>

</body>
</html>
