<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearNotes - Login</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="ClearNotesMiniLogo.png">

  <style>
    :root {
      --bg-top: #fcead4;
      --bg-bottom: #fad4a5;
      --accent-cyan: #00ffff;
      --accent-orange: #ff9d00;
      --text-dark: #333;
      --radius: 12px;
      --shadow: 0px 4px 12px rgba(0,0,0,0.15);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Container for the signup box */
    .login-shape {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      font-family: "Gravitas One", serif;
      font-size: 2.2rem;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    p {
      line-height: 1.6;
      color: #555;
      margin-bottom: 25px;
    }

    hr {
      border: none;
      height: 2px;
      background-color: rgba(0,0,0,0.1);
      margin: 30px 0;
      width: 100%;
    }

    .custom-button {
      background-color: var(--accent-cyan);
      color: #000;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 0px #00cccc;
      text-decoration: none;
      display: inline-block;
    }

    .custom-button:hover {
      background-color: var(--accent-orange);
      box-shadow: 0 4px 0px #cc7a00;
      transform: translateY(-2px);
    }

    .custom-button:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .footer-brand {
      margin-top: 40px;
      font-family: "Gravitas One", serif;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="login-shape">
    <h1>ClearNotes</h1>
    <p><b>Let's start by choosing your school!</b></p>
    
    <a href="maps.html" style="text-decoration: none;">
      <button class="custom-button">Choose your school</button>
    </a>

    <hr>

    <p>By signing up, you get personalized notes and resources from your specific grade and section.</p>
  </div>

  <div class="footer-brand">
    <h2>ClearNotes</h2>
  </div>

</body>
</html>
