<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Desk — ClearNotes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="ClearNotesMiniLogo.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dashboard-body">

  <aside class="sidebar">
    <span class="logo">ClearNotes</span>
    <nav>
      <a href="index.html">🏠 Home</a>
      <a href="personalizedDashboard.html">📊 Dashboard</a>
      <a href="pickSubject.html">📚 My Subjects</a>
      <a href="study.html" class="active">✍️ Study Desk</a>
      <a href="uploadnotes.html">📤 Upload</a>
    </nav>
  </aside>

  <main class="dashboard-main study-canvas">
    <header class="page-header">
      <div>
        <h1>Study Desk</h1>
        <p class="section-desc">Drag and organize your tools for a focused session.</p>
      </div>
    </header>

    <div class="window" id="win1">
      <div class="titlebar"><p>📘 AI Study Buddy</p></div>
      <div class="window-content">
        <iframe src="https://justusi-study-companion-2.hf.space" frameborder="0"></iframe>
      </div>
    </div>

    <div class="window" id="win2">
      <div class="titlebar"><p>🚀 Focus Mode</p></div>
      <div class="window-content detox-box">
        <p>Take a chance to wind down from distractions and focus on studies.</p>
        <a href="detox.html" class="btn btn-primary">Start Detox</a>
      </div>
    </div>

    <footer class="study-footer">
      <p>Study Buddy by Thimmapuram Murali via HuggingFace</p>
    </footer>
  </main>

  <script>
    // --- Window Draggable Logic ---
    let activeWindow = null;
    let offsetX = 0;
    let offsetY = 0;
    let zIndexCounter = 100;

    document.querySelectorAll(".window").forEach(win => {
      const bar = win.querySelector(".titlebar");

      bar.addEventListener("mousedown", e => {
        activeWindow = win;
        // Calculate offset so the window doesn't "jump" to the mouse corner
        const rect = win.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;

        win.style.zIndex = ++zIndexCounter;
        bar.style.cursor = "grabbing";
        
        // Prevent text selection while dragging
        e.preventDefault();
      });
    });

    document.addEventListener("mousemove", e => {
      if (!activeWindow) return;
      
      // Calculate new position
      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;

      activeWindow.style.left = x + "px";
      activeWindow.style.top = y + "px";
      activeWindow.style.position = "fixed"; // Keep it relative to screen
    });

    document.addEventListener("mouseup", () => {
      if (!activeWindow) return;
      activeWindow.querySelector(".titlebar").style.cursor = "grab";
      activeWindow = null;
    });
  </script>
</body>
</html>
