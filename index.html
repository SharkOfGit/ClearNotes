<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <div class="sidebar">
      <input id="search" placeholder="Search notes...">
      <button id="newNote">+ New Note</button>

      <div class="notes-list" id="notesList"></div>
    </div>

    <div class="editor">
      <header>
        <input id="title" placeholder="Title">
        <button id="deleteNote">Delete</button>
      </header>

      <textarea id="note" placeholder="Start typing..."></textarea>
      <p id="status">Saved ✔</p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
