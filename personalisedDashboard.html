<!DOCTYPE HTML>

<HEAD>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="Notes360-MiniLogo.png">
<link rel="stylesheet" href="styles.css">


<TITLE>Notes360 - Landing Page</TITLE>
</HEAD>

<BODY>

<h1><u>Personalized Dashboard</u></h1>
<h3>All you need from <span id="grade-display"></span><span id="section-display"></span> of <i><span id="school-name"></span></i></h3>

<hr style="border: none; height: 5px; background-color: #333;">

<h2>Syllabus</h2>
<div class="grid-container">
<div class="grid-item">
<h3>Science</h3>
<hr>
<p>NCERT Science Textbook for Class 9</p>
<div class="fixed-container">
<img src="https://ncert.nic.in/textbook/pdf/iesc1cc.jpg" alt="book-cover">
</div>
<br>
<button id="search-info">
  Search textbook on <br><div class="simpleimg"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/50px-Google_2015_logo.svg.png"></div>
</button>
</div>
</div>

<script>
const school = JSON.parse(localStorage.getItem("chosenSchool"));
const grade = localStorage.getItem("chosenGrade");
const section = localStorage.getItem("chosenSection");

document.getElementById("school-name").textContent = school ? school.name : "Not selected";
document.getElementById("grade-display").textContent = grade ? grade : "Not selected";
document.getElementById("section-display").textContent = section ? " " + section : "";

document.getElementById("search-info").onclick = () => {

const query = "NCERT Science Textbook Class 9 PDF";

const url = "https://www.google.com/search?q=" + encodeURIComponent(query);
window.open(url, "_blank");
};
</script>

<hr style="border: none; height: 5px; background-color: #333;">

<h2>Upload Leaderboard</h2>
<p>The leading note uploaders from your grade.</p>

<div class="topshape">
</div>

</BODY>
