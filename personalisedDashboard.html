<!DOCTYPE HTML>

<HEAD>
<link href="https://fonts.googleapis.com/css2?family=Gravitas+One&display=swap" rel="stylesheet">
<link rel="icon" href="Notes360-MiniLogo.png">
<STYLE>
h2, h3, p, ul, ol, button {
  font-family: "Segoe UI", "Segoe UI Light", sans-serif;
  margin: 10px;
}
h1 {
  font-family: "Gravitas One", "Noto Serif", serif;
  margin: 10px;
}
.custom-button {
  background-color: cyan;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
  margin: 10px;
}

.custom-button:hover {
  background-color: orange;
}

body {
  background-image: linear-gradient(to bottom, #fcead4, #fad4a5);
  margin: 0px;
}

.stickynote {
  width: 600px;
  height: auto;
  background-color: #87f8fa;
  display: grid;
  padding: 10px;
  color: black;
  border-radius: 15px;
  box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
  margin: 10px;
}

.stickynotes-grid {
  grid-template-columns: repeat(3, 1fr);
  grid-gap: 10px;
  background-color: grey;
  border-radius: 10px;
  padding: 10px;
  margin: 10px;
}

.video-container {
  width: 640px;
  height: 360px;
  border-radius: 15px;
  overflow: clip;
  margin: 10px;
}

.topshape {
  width: 100%;
  height: auto;
  background: white;
  padding: 20px;
  margin-bottom: 15px;
  margin-left: 0px;
  box-shadow: 0px 3px 8px rgba(0,0,0,0.2);
}

.fixed-container {
  width: 200px;
  height: 200px;
  margin: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.fixed-container img {
  width: 100%;
  height: 100%;
  object-fit: center;
}

.video {
  width: 100%;
  height: 100%;
  display: inline;
}

img {
  border-radius: 10px;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-gap: 10px;
}

.grid-item {
  background-color: lightblue;
  padding: 5px;
  border-radius: 10px;
  width: auto;
  height: auto;
  text-align: left;
  margin: 10px;
}

.centered-text {
  text-align: center;
}

select {
  border-radius: 7px;
  padding: 3px;
  transition: background-color 0.3s ease;
  cursor: pointer;
}
select:hover {
  background-color: teal;
}
option {
  background-color: white;
  cursor: pointer;
}
button {
  border-radius: 7px;
  padding: 6px 10px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}
button:hover {
  background-color: teal;
}
.simpleimg img {
  border-radius: 0px;
}

iFrame {
  margin: 10px;
  border-radius: 10px;
}
</STYLE>

<TITLE>Notes360 - Landing Page</TITLE>
</HEAD>

<BODY>

<h1><u>Personalized Dashboard</u></h1>
<h3>All you need from <span id="grade-display"></span><span id="section-display"></span> of <i><span id="school-name"></span></i></h3>

<hr style="border: none; height: 5px; background-color: #333;">

<h2>Syllabus</h2>
<div class="grid-container">
<div class="grid-item">
<h3>Science</h3>
<hr>
<p>NCERT Science Textbook for Class 9</p>
<div class="fixed-container">
<img src="https://ncert.nic.in/textbook/pdf/iesc1cc.jpg" alt="book-cover">
</div>
<br>
<button id="search-info">
  Search textbook on <br><div class="simpleimg"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/50px-Google_2015_logo.svg.png"></div>
</button>
</div>
</div>

<script>
const school = JSON.parse(localStorage.getItem("chosenSchool"));
const grade = localStorage.getItem("chosenGrade");
const section = localStorage.getItem("chosenSection");

document.getElementById("school-name").textContent = school ? school.name : "Not selected";
document.getElementById("grade-display").textContent = grade ? grade : "Not selected";
document.getElementById("section-display").textContent = section ? " " + section : "";

document.getElementById("search-info").onclick = () => {

const query = "NCERT Science Textbook Class 9 PDF";

const url = "https://www.google.com/search?q=" + encodeURIComponent(query);
window.open(url, "_blank");
};
</script>

<hr style="border: none; height: 5px; background-color: #333;">

<h2>Upload Leaderboard</h2>
<p>The leading note uploaders from your grade.</p>

<div class="topshape">
</div>

</BODY>
